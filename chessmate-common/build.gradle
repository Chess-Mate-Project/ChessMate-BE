plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.chessmate'
version = '0.0.1-SNAPSHOT'
description = 'chessmate-common'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

jar {
    enabled = true
}


tasks.register("prepareKotlinBuildScriptModel"){}
// 코틀린 버그 해결을 위한 신의 계시

dependencies {
}

tasks.named('test') {
    useJUnitPlatform()
}
