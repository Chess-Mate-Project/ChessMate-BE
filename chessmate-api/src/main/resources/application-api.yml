logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.apache.coyote.http11.Http11Processor: DEBUG
    # OIDC 인증 프로바이더 (여기서 invalid_nonce를 던짐)
    org.springframework.security.oauth2.client.oidc.authentication: TRACE
    # OAuth2 로그인 필터 전체
    org.springframework.security.oauth2.client.web: TRACE
    # 세션 생성 및 쿠키 관련 상세 로그
    org.springframework.session: DEBUG
    org.apache.catalina.session: DEBUG
    # 스프링 시큐리티 필터 체인의 상세 동작
    org.springframework.security.web.context: DEBUG
    org.springframework.security.web.authentication.HttpSessionAuthenticationStrategy: DEBUG
