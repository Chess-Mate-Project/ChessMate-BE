name: Deploy to EC2 with RDS

on:
  push:
    branches:
      - main  # 또는 배포를 원하는 브랜치명 (예: master)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle 빌드 (테스트 제외로 빌드 속도 향상)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # API 이미지 빌드 및 푸시
      - name: Build and Push API Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/chessladder-api:latest ./chessmate-api
          docker push ${{ secrets.DOCKER_USERNAME }}/chessladder-api:latest

      # Worker 이미지 빌드 및 푸시
      - name: Build and Push Worker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/chessladder-worker:latest ./chessmate-worker
          docker push ${{ secrets.DOCKER_USERNAME }}/chessladder-worker:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_PROD }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          script: |
            # 배포 디렉토리로 이동
            cd /opt/chessladder
            
            # 최신 이미지 풀링
            DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}" \
            docker compose -f docker-compose.prod.yml pull

            # 컨테이너 재시작 (환경변수 주입)
            DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}" \
            DB_URL="${{ secrets.DB_URL }}" \
            DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
            LICHESS_CLIENT_ID="${{ secrets.LICHESS_CLIENT_ID }}" \
            docker compose -f docker-compose.prod.yml up -d

            # 미사용 이미지 정리 (용량 확보)
            docker image prune -f
