name: ChessMate Simplified Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Images
        run: |
          docker build -f dockerfile-api -t ${{ secrets.DOCKER_USERNAME }}/chessmate-api:latest .
          docker build -f dockerfile-worker -t ${{ secrets.DOCKER_USERNAME }}/chessmate-worker:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/chessmate-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/chessmate-worker:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cd /opt/chessladder
            
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            
            docker pull ${{ secrets.DOCKER_USERNAME }}/chessmate-api:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/chessmate-worker:latest

            # 1. 기존 컨테이너 깔끔하게 정리 (이름 충돌 방지)
            docker compose -f docker-compose.prod.yml down --remove-orphans || true
            docker rm -f chessladder_redis chessmate-mysql chessmate-api chessmate-worker || true
            
            # 2. 모든 환경변수를 주입하며 실행 (유저명을 바꿨으니 DB_USERNAME이 중요!)
            DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}" \
            DB_URL="${{ secrets.DB_URL }}" \
            DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
            LICHESS_CLIENT_ID="${{ secrets.LICHESS_CLIENT_ID }}" \
            REDIS_HOST="chessladder_redis" \
            docker compose -f docker-compose.prod.yml up -d

            # 안 쓰는 이미지 정리
            docker image prune -f
