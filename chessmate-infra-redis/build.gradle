plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.chessmate'
version = '0.0.1-SNAPSHOT'
description = 'chessmate-infra-redis'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.register("prepareKotlinBuildScriptModel"){} // 코틀린 버그 해결을 위한 신의 계시


repositories {
    mavenCentral()
}

bootJar {
    enabled = false
}
jar {
    enabled = true
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'


    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'org.projectlombok:lombok'

    implementation project(':chessmate-common')
    implementation project(':chessmate-external')
    implementation project(':chessmate-infra-core')
}

tasks.named('test') {
    useJUnitPlatform()
}
