spring:
  config:
    activate:
      on-profile: worker
  application:
    name: ChessMate-batch

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

chessmate:
  sync:
    chesscom:
      parallelism: 5


management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true