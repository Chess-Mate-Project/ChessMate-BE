spring:
  config:
    activate:
      on-profile: worker-prod
  application:
    name: ChessMate-worker

chessmate:
  sync:
    chesscom:
      parallelism: 5

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true